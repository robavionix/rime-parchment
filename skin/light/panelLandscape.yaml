floatTargetScale:
  x: 0.45
  "y": 0.8
floatingKeyboardButtonBackgroundStyle:
  buttonStyleType: "geometry"
  cornerRadius: 8.5
  highlightColor: "#EFE6D2"
  highlightLowerEdgeColor: "#B9A985"
  insets:
    bottom: 6
    left: 3
    right: 3
    top: 6
  normalColor: "#FBF6EA"
  normalLowerEdgeColor: "#B9A985"
keyboardBackgroundStyle:
  buttonStyleType: "geometry"
  normalColor: "#E9DFC9"
keyboardLayout:
- HStack:
    subviews:
    - Cell: "toolbarHamster3Button"
    - Cell: "toolbarKeyboardDefinition"
    - Cell: "toolbarFeedbackButton"
    - Cell: "toolbarCheckUpdateButton"
- HStack:
    subviews:
    - Cell: "toolbarSkinButton"
    - Cell: "toolbarSkinPreference"
    - Cell: "toolbarUploadButton"
    - Cell: "toolbarToggleEmbeddedButton"
keyboardStyle:
  backgroundStyle: "keyboardBackgroundStyle"
  insets:
    bottom: 10
    left: 12
    right: 12
    top: 10
toolbarCheckUpdateButton:
  action:
    openURL: "https://apps.apple.com/cn/app/%E5%85%83%E4%B9%A6%E8%BE%93%E5%85%A5%E6%B3%95/id6744464701"
