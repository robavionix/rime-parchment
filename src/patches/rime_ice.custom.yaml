# 雾凇拼音（全拼 / 26 键中英混打）方案补丁
#
# 面向有中英文混打需求的用户。
# 因此本方案的取向与上游默认相反：英文是一等公民，不是偶尔冒头的干扰项。

patch:
  schema/version: "5.2"

  # ════════════════════════════════════════════════════════
  # 拼写规则（5.1 起整表重定义）
  # ════════════════════════════════════════════════════════
  # 此前用 speller/algebra/+ 在上游规则后面追加。现在要**摘掉**上游的若干条，
  # 而补丁只能追加或整表替换，删不了列表中间的某一项，所以这里把整张表写出来：
  # 上游原样照抄，只注释掉要摘的。上游原表在 rime_ice.schema.yaml 的
  # speller/algebra，雾凇更新后若它有增减，这里要人工对一遍
  # （逐条核对的做法见 docs/NOTES.md 的「5.1」一节）。
  #
  # 【为什么摘】上游的「自动纠错」是用 derive 做的：给音节多造一个拼写，
  # 比如让 go 也能读成 gou / gong。造出来的拼写和真拼音地位相同，于是：
  #
  #   ① 抢简拼 / 混拼。Rime 切分音节有条硬规矩：整串输入能用「正常拼写」走通时，
  #      简拼读法**全部作废**。sih 一旦能读成 shi，「si h → 似乎」就没了；
  #      九宫格更糟 —— 数字键把字母合并了，46 本是 国内 / 很难 / 购买 的简拼，
  #      却因为能读成 go、ho 只出「后 公 红」。
  #   ② 抢英文。中英混打下，一个英文单词若能被拼音完整切开，中文就排到它
  #      前面：to → 头、do → 动、done → 东阿、coming → 聪明、juice → 九册。
  #
  # 取舍原则（用户定）：**先把误判压到最低，容错排第二，中英文同一把尺子。**
  # 「误判」是你打的是对的、它却给了别的；「容错」是你打错了、它帮你改回来。
  # 两者冲突时砍容错。
  #
  # 所以判据只有一条：规则造出的拼写，只要实测撞上了词库里真实存在的中文词或
  # 英文单词（哪怕只撞一个生僻词），就摘。37 条里摘 23 条、留 14 条。留下的是
  # wia → wai、jei → jie、qioa → qiao、riu → rui、neu → nue 这类，实测零误判。
  #
  # 数据、做法、每条规则抢了哪些词：docs/NOTES.md 的「5.1」一节
  # 要恢复某一条：去掉它行首的 `# `。
  speller/algebra:
    ### 超级简拼（上游原样）
    - erase/^hm$/ # 响应超级简拼，取消「噷 hm」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - erase/^m$/  # 响应超级简拼，取消「呣 m」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - erase/^n$/  # 响应超级简拼，取消「嗯 n」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - erase/^ng$/ # 响应超级简拼，取消「嗯 ng」的独占（如果拼音词库有这个音节的话，雾凇里没有）
    - abbrev/^([a-z]).+$/$1/   # 超级简拼
    - abbrev/^([zcs]h).+$/$1/  # 超级简拼中，zh ch sh 视为整体（ch'sh → 城市），而不是像这样分开（c'h's'h → 吃好睡好）。

    ### v u 转换（上游原样）
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/

    ### 前后鼻音模糊音（本项目追加）
    # 上游把全部模糊音规则都注释掉了（rime_ice.schema.yaml 第 311 行起）。
    # 这里只启用前后鼻音，其余（n/l、zh/z、f/h 等）保持关闭。
    #
    # an/ang 的规则同时覆盖 ian/iang、uan/uang（都以 an 结尾），
    # 故无需上游那几条更细粒度的规则。
    #
    # ⚠️ 按「误判优先」的尺子量，模糊音本身就是误判来源，只是它是点名要的功能，
    # 所以留着、把代价写明：
    #   · 精确打 jinshen（谨慎）首位出「精神」—— 两个音被当成一个
    #   · 混打下 ten、tin、din 被读成 teng、ting、ding，首位出「疼 听 定」
    # 不需要的话删掉下面六行即可，其余规则不受影响。
    - derive/ang$/an/
    - derive/an$/ang/
    - derive/eng$/en/
    - derive/en$/eng/
    - derive/ing$/in/
    - derive/in$/ing/

    # ── 相邻键容错：5.1 起三条全部摘除 ────────────────────
    # 5.0 加过三条针对鼻音韵尾误触的容错：
    #     - derive/n$/m/     an → am、wen → wem（m 在 n 右边）
    #     - derive/ng$/mg/   zhong → zhomg、ying → yimg
    #     - derive/ng$/nh/   zhong → zhonh、fang → fanh（h 在 g 右边）
    #
    # 当时的理由是「汉语拼音没有以 m 结尾的音节，也没有 nh 组合，这些形式全是
    # 空位，白捡」。这只对**全拼**成立。实测它们是整张表里抢得最凶的三条：
    #
    #   · 抢「全拼 + 声母」的混拼 —— 最常见的偷懒打法。bim 本该是 bi'm（避免），
    #     被读成了 bin；huam（画面）、jum（居民）、lim（里面）、kem（科目）、
    #     wenh（文化）、renh（任何）、fanh（返回）同理。
    #     n→m 抢 121 处、ng→nh 抢 103 处、ng→mg 抢 60 处
    #   · n→m 另外抢了 99 个英文单词：am、team、ham、sum、jumping、camping。
    #     打 am 首位出的是「按」
    #
    # 教训：给拼音加派生规则之前，全拼、简拼 / 混拼、英文三边都要量，
    # 不能只看「它是不是合法音节」。量法见 docs/NOTES.md 的「5.1」一节。

    # ── 九宫格数字映射（T9-ONLY BEGIN）──────────────────────
    # 2B 统一方案：九宫格不再用独立的 t9 方案，直接复用本方案。
    # derive 是叠加式的，字母拼写全部保留，26 键完全不受影响。
    #
    # ⚠️ 位置有讲究：
    #   · 排在前后鼻音模糊音**之后** —— 模糊音造出的拼写一并映射成数字，
    #     九宫格同样享有模糊音
    #   · 排在自动纠错**之前**（5.1 起）—— 那些换位错拼是全键盘上的手误，
    #     九宫格上不存在；映射成数字只会给数字串平添读法。实测挪到纠错
    #     之前，九宫格全拼首位命中 84.5% → 85.4%，116 例变好、3 例小幅后移，
    #     26 键不受影响
    #
    # 若部署时建 prism 失败（见上面的失败记录），第一步就是把这 8 条
    # 移到模糊音**之前**，牺牲九宫格的容错换取规模。
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[hgi]/4/
    - derive/[jkl]/5/
    - derive/[omn]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/
    # ── 九宫格数字映射（T9-ONLY END）────────────────────────
    #
    # ⚠️ 失败记录（2026-08，实机验证）
    # 曾额外启用上游注释掉的「顺序纠错」六条（dna→dan、qni→qin、
    # rne→ren、qnu→qun、qai→qia、qain→qian）。加上去之后**部署失败，
    # 完全无法输入中文**，回退 V9.0 才恢复。
    # 推测原因：超级简拼 + 6 条模糊音 + 9 条容错叠加，在 187 万条词库上
    # 建 prism 时爆掉。
    # 结论：这张表每多一条派生，拼写索引就膨胀一圈，别再往上加。那六条
    # 上游自己也标注了「对全拼简拼混输有副作用」，本来就过不了误判这一关。

    ### 自动纠错（上游原样，要摘的已注释）
    # 排在九宫格数字映射**之后**：这样下面造出的换位拼写只存在于字母键盘，
    # 不会被映射成数字。原因见上面数字映射处的说明。
    # - derive/([zcs])h(a|e|i|u|ai|ei|an|en|ou|uo|ua|un|ui|uan|uai|uang|ang|eng|ong)$/h$1$2/
    #   ↑ 【5.1 摘除】hzi → zhi。抢混拼 42 处：孩子 合作 还在 黑色 汉字 汇总 缓存
    # - derive/([zcs])h([aeiu])$/$1$2h/
    #   ↑ 【5.1 摘除】zih → zhi。抢混拼 12 处：似乎 组合 策划 词汇 此后 丝毫 自豪
    - derive/^([wghk])ai$/$1ia/  # wia → wai
    # - derive/([wfghkz])ei$/$1ie/
    #   ↑ 【5.1 摘除】wie → wei。抢英文：fie bogie hie；抢混拼 1 处
    - derive/([jqx])ie$/$1ei/  # jei → jie
    # - derive/([rtypsdghklzcbnm])ao$/$1oa/
    #   ↑ 【5.1 摘除】boa → bao。抢英文 8 个：roaming koala coating coaxing
    - derive/([ypfm])ou$/$1uo/
    # - derive/([wrtypsdfghklzcbnm])ang$/$1nag/
    #   ↑ 【5.1 摘除】wnag → wang。抢混拼 16 处：在那个 是那个 把那个 有哪个；抢英文 snag
    # - derive/([wrtypsdfghklzcbnm])ang$/$1agn/
    #   ↑ 【5.1 摘除】wagn → wang。抢混拼 12 处：大姑娘 发给你 瓦格纳；抢英文 magna
    # - derive/([wrtpsdfghklzcbnm])eng$/$1neg/
    #   ↑ 【5.1 摘除】dneg → deng。抢混拼 1 处
    # - derive/([wrtpsdfghklzcbnm])eng$/$1egn/
    #   ↑ 【5.1 摘除】degn → deng。抢混拼 7 处：各功能 这个呢
    # - derive/([qtypdjlxbnm])ing$/$1nig/
    #   ↑ 【5.1 摘除】dnig → ding。抢混拼 9 处：油腻感 要你管 牟尼沟
    # - derive/([qtypdjlxbnm])ing$/$1ign/
    #   ↑ 【5.1 摘除】dign → ding。抢混拼 6 处：一股脑 倪光南 寄给你；抢英文 malign
    # - derive/([rtysdghklzcn])ong$/$1nog/
    #   ↑ 【5.1 摘除】dnog → dong。抢英文 snog
    # - derive/([rtysdghklzcn])ong$/$1ogn/
    #   ↑ 【5.1 摘除】dogn → dong。抢混拼 1 处
    - derive/([qtpdjlxbnm])iao$/$1ioa/
    - derive/([qtpdjlxbnm])iao$/$1oia/
    - derive/([rtsghkzc])ui$/$1iu/
    # - derive/([qjlxnm])iu$/$1ui/
    #   ↑ 【5.1 摘除】lui → liu。抢英文：juice quiche
    # - derive/([qjlxn])iang$/$1aing/
    #   ↑ 【5.1 摘除】jaing → jiang。抢混拼 1 处；叠上前后鼻音模糊音后抢英文 lain jain
    # - derive/([qjlxn])iang$/$1inag/
    #   ↑ 【5.1 摘除】jinag → jiang。抢混拼 3 处：你哪个 你那个
    # - derive/([g|k|h|zh|sh])ua$/$1au/
    #   ↑ 【5.1 摘除】gau → gua。抢英文 5 个：gauge hauling haute
    - derive/([g|h|k|zh|ch|sh])uai$/$1aui/
    # - derive/([qrtysdghjklzxcn])uan$/$1aun/
    #   ↑ 【5.1 摘除】haun → huan。抢英文：haunting daunting
    - derive/([nlyjqx])ue$/$1eu/
    - derive/([g|h|k|zh|ch|sh])uang$/$1aung/
    # - derive/([g|h|k|zh|ch|sh])uang$/$1uagn/
    #   ↑ 【5.1 摘除】huagn → huang。抢混拼 1 处：花姑娘
    - derive/([g|h|k|zh|ch|sh])uang$/$1unag/
    - derive/([g|h|k|zh|ch|sh])uang$/$1augn/
    - derive/([jqx])iong$/$1inog/
    # - derive/([jqx])iong$/$1oing/
    #   ↑ 【5.1 摘除】joing → jiong。叠上前后鼻音模糊音后，join 首位成了「囧」
    - derive/([jqx])iong$/$1iogn/
    - derive/([jqx])iong$/$1oign/
    # - derive/([rtsdghkzc])o(u|ng)$/$1o/
    #   ↑ 【5.1 摘除】do → dou|dong。抢英文 126 个：to do so done coming hole role shoe；抢混拼 11 处：东欧 中欧 海鸥
    # - derive/(.+)ong$/$1on/
    #   ↑ 【5.1 摘除】lon → long。抢英文 31 个：son done zone ton con non salon canyon
    # - derive/([tl])eng$/$1en/
    #   ↑ 【5.1 摘除】ten → teng。抢英文：ten lending（前后鼻音模糊音仍会让 ten 出「疼」，见那里的说明）
    # - derive/([qwrtypsdfghjklzxcbnm])([aeio])ng$/$1ng/
    #   ↑ 【5.1 摘除】lng → lang|leng|ling|long。抢简拼 25 处：纪念馆 才能够 就能够 不能够 是那个



  # ════════════════════════════════════════════════════════
  # 硬伤 1：reduce_english_filter 方向反了
  # ════════════════════════════════════════════════════════
  # 上游默认 mode: custom，专门把一批英文单词压到第 2 位之后。
  # 该设计假设「用户主要打中文，英文冒出来很烦」——与本项目人群相反。
  reduce_english_filter/mode: none

  # ════════════════════════════════════════════════════════
  # 硬伤 2：corrector 把英文纠错成中文
  # ════════════════════════════════════════════════════════
  # corrector.lua 会对输入做模糊纠音，导致 Amazon 被纠成「a ma zong 阿妈粽」
  # 并抢占首选。上游的应对是把 Amazon/NASA/SOHO 等硬钉进 custom_phrase.txt，
  # 属于打补丁而非解决问题。
  #
  # corrector 没有开关，只能从 filter 链摘除，故整体重定义 filters。
  # 代价：失去中文错音错字提示（如把 shen shen xue zi 提示为 xin xin）。
  #       对本项目人群而言，这项收益远小于它对英文输入的破坏。
  # 若想恢复：把下面第一行的注释解开即可。
  engine/filters:
    # - lua_filter@*corrector                       # 错音错字提示（已禁用，见上）
    # - reverse_lookup_filter@radical_reverse_lookup  # 部件拆字滤镜（已移除，见下）
    - lua_filter@*autocap_filter                    # 英文自动大写
    - lua_filter@*v_filter                          # v 模式 symbols 优先
    - lua_filter@*pin_cand_filter                   # 置顶候选项
    - lua_filter@*long_word_filter                  # 长词优先
    - lua_filter@*reduce_english_filter             # 已由 mode: none 停用
    - simplifier@emoji                              # Emoji
    - simplifier@traditionalize                     # 简繁切换
    # - lua_filter@*search@radical_pinyin           # 部件拆字辅码（已移除，见下）
    - lua_filter@*en_auto_space_filter              # 连续打英文单词时补空格（5.2，见下）
    - uniquifier                                    # 去重

  # ════════════════════════════════════════════════════════
  # 连续打英文单词时自动补空格（5.2）
  # ════════════════════════════════════════════════════════
  # 之前连着打两个英文单词会粘在一起（helloworld），不管是点选候选、按空格选，
  # 还是按回车把字母原样上屏。
  #
  # 两个 Lua 组件配套：处理器记住「上一次上屏的是不是英文」，并接管打字中途的
  # 回车；滤镜（就是上面 engine/filters 里那一行）给英文候选前面加空格。
  #
  # 空格补在**下一个单词前面**，不是这个单词后面 —— 补在后面的话，接标点就成了
  # 「hello ,」，而 Rime 删不掉已经上屏的字符。只在上一次上屏的是英文、且之后
  # 没有别的键进过输入框时才补。取舍与细节写在 lua/en_auto_space_processor.lua 开头。
  #
  # 位置用 @before 1：九宫格那段另有一条 `@before 0: t9_processor`。两条谁先生效
  # 结果都对 —— 本条只要求排在 express_editor（处理回车的那个）之前。
  engine/processors/@before 1: lua_processor@*en_auto_space_processor

  # 上一个英文单词上屏后超过这么多秒就不再补（0 = 不限）。挪光标、切 App、
  # 点发送按钮，Rime 都看不见，只能靠时间兜底。要关掉整个功能：注释掉上面那行
  # 处理器即可，滤镜没有处理器记状态就不会动任何候选。
  en_auto_space/timeout: 10

  # ════════════════════════════════════════════════════════
  # 精简：移除部件拆字（反查 + 辅码）
  # ════════════════════════════════════════════════════════
  # 两个功能共用 radical_pinyin 词库（源 2.1 MB，编译产物约 5.8 MB）：
  #
  #   ① 部件拆字反查 —— 前缀 uU，用部件拼音倒查生僻字
  #      如 uUniuniuniu → 犇，uUshuishuishui → 淼，uUbinbei → 赟
  #      用途：读古籍、打人名怪字。用户明确表示不需要生僻字。
  #
  #   ② 辅码 —— 触发键 `，打字中途补部件拼音来筛候选
  #      如 shi`ri → 只剩含「日」的：时 是 昰
  #      用途：消歧提速。但需记忆部件拼音，实际使用率极低。
  #      且上游未提供 radical_pinyin 配置块，该功能本就处于半失效状态。
  #
  # 要恢复：解开上面两行 filter 注释，还原下面四项，
  #        并在 build-rime.sh 中去掉对 radical_pinyin.* 的删除。
  schema/dependencies:
    - melt_eng

  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    # - affix_segmentor@radical_lookup              # 部件拆字自定义 tag（已移除）
    - punct_segmentor
    - fallback_segmentor

  engine/translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator    # 时间、日期、星期
    - lua_translator@*lunar              # 农历
    - lua_translator@*uuid               # UUID
    - table_translator@custom_phrase     # 自定义短语
    - table_translator@melt_eng          # 英文输入
    - table_translator@cn_en             # 中英混合词汇
    # - table_translator@radical_lookup  # 部件拆字反查（已移除）
    - lua_translator@*unicode            # Unicode
    - lua_translator@*number_translator  # 数字、金额大写
    - lua_translator@*calc_translator    # 计算器
    - lua_translator@*force_gc           # 暴力 GC

  # 去掉 radical_lookup 的触发规则，其余保持上游原样
  recognizer/patterns:
    punct: "^v([0-9]|10|[A-Za-z]+)$"
    # radical_lookup: "^uU[a-z]+$"       # （已移除）
    unicode: "^U[a-f0-9]+"
    number: "^R[0-9]+[.]?[0-9]*"
    calculator: "^cC.+"
    gregorian_to_lunar: "^N[0-9]{1,8}"

  # corrector 移除后，这两项失去用途（它们本就是专为 corrector 服务的）
  translator/always_show_comments: false
  translator/comment_format: []

  # ════════════════════════════════════════════════════════
  # 硬伤 3：英文词库覆盖面不足
  # ════════════════════════════════════════════════════════
  # 已在词库层解决：melt_eng.dict.yaml 改挂 en_merged（43,005 条），
  # 含教育/证件/居住/财务/医疗/交通/职场场景词与高频词组。
  # 此处无需配置。

  # ════════════════════════════════════════════════════════
  # 硬伤 4：英文无法连打
  # ════════════════════════════════════════════════════════
  # 不采用 enable_sentence: true。原因：英文词库没有词间语法模型，
  # 开启后 Rime 会把输入切开硬拼——important → import + ant，
  # together → to + get + her，垃圾候选会和正确整词抢位置。
  # 这正是上游把它设为 false 的原因。
  #
  # 改用两个更有效且零风险的替代：
  #   ① enable_completion：打 inter 直接出 international（提速的大头）
  #   ② 高频词组作为单条词收进词库（见 curated_terms.txt 末尾段），
  #      thank you / looking forward to 等一次成型，不依赖连句机制拼接
  melt_eng/enable_sentence: false
  melt_eng/enable_completion: true

  # 允许 Rime 学习你的英文用词频率，常用词会逐渐前移
  melt_eng/enable_user_dict: true

  # ════════════════════════════════════════════════════════
  # 中英模式每次回到中文
  # ════════════════════════════════════════════════════════
  # 现象：新开 App 呼出键盘，打出来的是英文（26 键）或数字（九宫格），
  #       切一下键盘就恢复正常。
  #
  # 原因：上游 switches 里的 ascii_mode 没有 reset，状态跨会话保留。
  #       上次上划切到英文模式没切回来，下次呼出时它还开着 ——
  #       ascii_mode 为开时按键原样透传，26 键上就是字母，九宫格上就是数字。
  #       切键盘之所以能治，是因为切换键会 switchRimeSchema，
  #       重新加载方案时开关被重置。
  #
  # 修法：给 ascii_mode 补上 reset: 0，每次加载方案强制回中文。
  #       临时要打英文仍然上划切换，只是不再被带到下一次。
  #
  # switches/@0 指列表第 0 项，即 ascii_mode（见 rime_ice.schema.yaml）。
  switches/@0/reset: 0


  # ════════════════════════════════════════════════════════
  # 九宫格并入本方案（T9-ONLY BEGIN）
  # ════════════════════════════════════════════════════════
  # 背景：元书记住的是**上次用过的 Rime 方案**，而键盘布局由皮肤的
  # primaryKeyboard 固定。两者各记各的，于是「九宫格布局 + rime_ice 方案」
  # 必然出现 —— 按 2 它不认识，原样上屏成数字。
  #
  # 把 t9 排进 schema_list 第一位治不了（V9.9 实测无效）：那只决定全新
  # 部署时的初始方案，覆盖不了运行时记忆。
  #
  # 皮肤格式里没有「键盘加载时绑定方案」的机制，switchRimeSchema 只存在于
  # 按键动作里。所以唯一能根除的办法是**让不匹配不可能发生**：删掉 t9，
  # 两个键盘共用本方案，元书记住哪个都是它。
  #
  # t9 本就是本方案的派生（t9.schema.yaml 第一行 __include rime_ice.schema.yaml），
  # 相对本方案只多了三样：数字映射（已在上面并入）、t9_processor、prism: t9。

  # 数字进 speller，否则九宫格按键不被当作输入码。
  # 26 键不受影响：数字键盘的 0-9 是 symbol 直发系统，根本不进 Rime。
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`9876543210

  # ⚠️ initials 必须跟着一起加，只加 alphabet 是不够的。
  # alphabet 决定「哪些键算输入码」，initials 决定「哪些键能**起头**」。
  # 数字不在 initials 里的话，空串状态下按 2 不被认为能开始组词，直接原样
  # 上屏 —— 九宫格会永远只出数字，且切键盘也救不回来。
  # t9.schema.yaml 是 alphabet 与 initials 两行都带数字的，照抄即可。
  # 反引号不进 initials，沿用上游做法（让单个 ` 能直接上屏）。
  speller/initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210

  # 元书原生九宫格处理器，负责把数字串还原成拼音显示在预编辑区。
  #
  # ⚠️ 它是元书编译进 App 的组件，不属于 librime（故安卓构建会剥离本段）。
  # ⚠️ 若 26 键出现异常（字母输入不响应、预编辑错乱），**第一个要删的就是这行**。
  #    删掉后中文照打，只是九宫格预编辑区会显示数字串而非拼音。
  engine/processors/@before 0: t9_processor

  t9:
    isDisplayOriginalPreedit: false

  # 预编辑还原需要拼音提示码，上游为 corrector 设的 8 不够九宫格用
  translator/spelling_hints: 100

  # ── 九宫格 1 键点按 → 工程符号 / 微积分 / 希腊字母 ──────────
  # 1 在 speller/alphabet 里但没有任何拼写以 1 开头，speller 会放行，
  # 于是落到 punctuator 弹候选（有输入时它是分词键，见下面的 key_binder）。
  #
  #   工程    ° ± × ÷ ≈ ≤ ≥ ‰ ℃ Ω
  #   微积分  ∂ ∫ ∑ √ ∞ ∇ →
  #   希腊    Δ μ π α β θ ω λ σ φ
  #
  # 数字 1 仍排第一位，点 1 再上屏 1 的习惯不变。
  #
  # ⚠️ 逐键打补丁，**不能整块重定义 punctuator/half_shape** ——
  # 本方案的 half_shape 是 `__include: default:/punctuator/half_shape`，
  # 整块覆盖会把全部中文标点一起干掉（t9 方案当年就是这么做的，
  # 它不在乎是因为九宫格标点走元书内置组件，26 键可不行）。
  punctuator/half_shape/1: [1, "°", "±", "×", "÷", "≈", "≤", "≥", "Δ", "μ", "π",
                            "α", "β", "θ", "ω", "λ", "σ", "φ",
                            "∂", "∫", "∑", "√", "∞", "∇", "→",
                            "℃", "‰", "Ω", "_", "@"]

  # 数字键盘左上角符号列的 @ 会被 punctuator 拦下弹候选。
  # 值改成单个字符串，Rime 就直接上屏。
  "punctuator/half_shape/@": "@"
  "punctuator/half_shape/#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]

  # 九宫格上打字中途按 1 分词（沿用 t9 方案的绑定）
  key_binder/bindings:
    - { when: has_menu, accept: 1, send: apostrophe }
  # ════════════════════════════════════════════════════════
  # （T9-ONLY END）
  # ════════════════════════════════════════════════════════
