# 中文九键方案补丁

patch:

  # ════════════════════════════════════════════════════════
  # 数字键盘上的 @ 直接上屏
  # ════════════════════════════════════════════════════════
  # 现象：九宫格 → 左下角 123 → 数字键盘，左上角符号列里点 @，
  #       出来的不是 @，而是一串候选「1 @ ！ ： 、 …… ～」。
  #
  # 原因：那一列是元书内置组件 numericSymbols，点选后把字符送进 Rime，
  #       被 t9 方案的 punctuator 拦下：
  #
  #         punctuator:
  #           half_shape:
  #             "@": [1, "@", ！, ：, 、, ……, ～]     # 列表 = 弹候选
  #
  #       写邮箱、@ 人的时候还要从候选里挑一下，多一步。
  #
  # 修法：把 "@" 的值从列表改成单个字符串。Rime 的规则是
  #       列表 → 弹候选菜单，单字符串 → 直接上屏。
  #
  # 另两个键（"1" 和 "#"）保持上游原样：1 键在九宫格上是符号入口，
  # 弹候选是它的正常职责。
  punctuator/half_shape:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
    "@": "@"
    "#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]

  # ════════════════════════════════════════════════════════
  # 中英模式每次回到中文（与 rime_ice 同款，但必须单独打一遍）
  # ════════════════════════════════════════════════════════
  # 4.6 给 rime_ice 补了 ascii_mode 的 reset，但九宫格没吃到 ——
  # t9.schema.yaml 是靠 `__include: rime_ice.schema.yaml:/` 拉取整份配置的，
  # 而 .custom.yaml 补丁按方案文件各自生效，不会跟着 __include 传递。
  #
  # 所以同一条规则要在两个补丁里各写一遍。melt_eng 上游自带 reset: 0，无需处理。
  #
  # switches/@0 指 switches 列表第 0 项，即 ascii_mode（继承自 rime_ice.schema.yaml）。
  switches/@0/reset: 0
