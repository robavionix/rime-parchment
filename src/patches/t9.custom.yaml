# 中文九键方案补丁

patch:

  # ════════════════════════════════════════════════════════
  # 数字键盘上的 @ 直接上屏
  # ════════════════════════════════════════════════════════
  # 现象：九宫格 → 左下角 123 → 数字键盘，左上角符号列里点 @，
  #       出来的不是 @，而是一串候选「1 @ ！ ： 、 …… ～」。
  #
  # 原因：那一列是元书内置组件 numericSymbols，点选后把字符送进 Rime，
  #       被 t9 方案的 punctuator 拦下：
  #
  #         punctuator:
  #           half_shape:
  #             "@": [1, "@", ！, ：, 、, ……, ～]     # 列表 = 弹候选
  #
  #       写邮箱、@ 人的时候还要从候选里挑一下，多一步。
  #
  # 修法：把 "@" 的值从列表改成单个字符串。Rime 的规则是
  #       列表 → 弹候选菜单，单字符串 → 直接上屏。
  #
  # 另两个键（"1" 和 "#"）保持上游原样：1 键在九宫格上是符号入口，
  # 弹候选是它的正常职责。
  punctuator/half_shape:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
    "@": "@"
    "#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]
